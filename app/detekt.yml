naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention (they read as a type, not a verb) -
    # without this, detekt would flag every composable in the codebase forever, baseline or not.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # @Composable functions routinely take 7+ params (label, value, onValueChange, modifier,
    # colors, ...) as a matter of course - that's the pattern the whole component library here
    # already follows, not a design smell to flag on every new one.
    ignoreAnnotated: ['Composable']
  LongMethod:
    # Same reasoning: declarative UI naturally reads as one long function body per screen/slot.
    ignoreAnnotated: ['Composable']
